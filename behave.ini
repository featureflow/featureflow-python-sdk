[behave]
# json_value.feature isn't symlinked in (no jsonValue()-equivalent in this SDK yet).
# @builder-injects-implicit-attributes / @builder-defers-implicit-attributes: this SDK
#   doesn't inject featureflow.user.id/date anywhere -- neither pattern applies (see
#   features/steps/user_builder_steps.py).
# @user-builder-validates-empty-id: User.__init__ accepts an empty id silently.
#
# Each line is its own --tags group; groups AND together (comma within a single line
# would OR instead, which is not what we want here).
tags = ~@integration
       ~@builder-injects-implicit-attributes
       ~@builder-defers-implicit-attributes
       ~@user-builder-validates-empty-id
